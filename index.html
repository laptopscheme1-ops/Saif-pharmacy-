<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b6b5c"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><title>Pharmacy Management</title><style>body{margin:0;padding:10px;background:#fff}</style></head><body>
<div id="ph"><style>
#ph{font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;max-width:720px;margin:0 auto;color:#14302b}
#ph *{box-sizing:border-box}
#ph .hd{background:#0b6b5c;color:#fff;padding:12px 14px;border-radius:12px;font-size:18px;font-weight:700}
#ph .hd small{display:block;font-weight:400;font-size:12px;opacity:.85}
#ph nav{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0}
#ph nav button{padding:9px 4px;border:1px solid #bcd3ce;background:#fff;border-radius:9px;font-size:13px;color:#14302b}
#ph nav button.on{background:#0b6b5c;color:#fff;border-color:#0b6b5c}
#ph input,#ph select{width:100%;padding:10px;border:1px solid #bcd3ce;border-radius:8px;margin:2px 0 6px;font-size:15px;background:#fff}
#ph label{font-size:12px;color:#4d6761;display:block}
#ph button.b{background:#0b6b5c;color:#fff;border:0;padding:10px 16px;border-radius:8px;font-size:15px;margin:4px 4px 4px 0}
#ph button.s{background:#e6f0ee;color:#14302b;border:0;padding:7px 10px;border-radius:7px;margin-left:4px}
#ph button.d{background:#fbe9e7;color:#b3261e}
#ph h3{margin:16px 0 6px;font-size:16px}
#ph .g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#ph .c{background:#eef5f3;border-radius:10px;padding:10px}
#ph .c b{display:block;font-size:19px}
#ph .r{display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid #dde9e6;padding:8px 0}
#ph .r small{color:#4d6761}
#ph .red{color:#b3261e}#ph .amb{color:#a15c00}
#ph table{width:100%;border-collapse:collapse;font-size:13px}
#ph td,#ph th{padding:5px;border-bottom:1px solid #dde9e6;text-align:left}
#ph .tot{font-size:20px;font-weight:700;margin:6px 0}
#ph .rc{position:fixed;inset:0;background:#fff;z-index:99999;overflow:auto;padding:16px;font-size:14px}
#ph .lock{max-width:280px;margin:60px auto;text-align:center}
#ph #u_sg,#ph #m_sg{max-height:260px;overflow:auto}
@media print{body *{visibility:hidden}#ph .rc,#ph .rc *{visibility:visible}#ph .rc{position:absolute;left:0;top:0;width:100%}#ph .np{display:none}}
</style><div id="ph-app"></div><div id="ph-rc"></div>
<script>
(function(){
var K='pharmaV1',$=function(i){return document.getElementById(i)},D,cart=[],tab='dash',ed=null,ok=false,pimg=null,lastAg='';
try{D=JSON.parse(localStorage.getItem(K))}catch(e){}
D=D||{meds:[],sales:[],purch:[],custs:[],sups:[],set:{name:'My Pharmacy',addr:'',phone:'',pin:'1234',foot:'Thank you. Get well soon!'}};
var CAT="Panadol 500mg Tab|Paracetamol|GSK;Panadol Extra Tab|Paracetamol + Caffeine|GSK;Panadol CF Tab|Paracetamol + Pseudoephedrine + Chlorpheniramine|GSK;Calpol Syrup|Paracetamol|GSK;Calpol 6 Plus Susp|Paracetamol|GSK;Augmentin 625mg Tab|Amoxicillin + Clavulanic acid|GSK;Augmentin 1g Tab|Amoxicillin + Clavulanic acid|GSK;Augmentin Susp|Amoxicillin + Clavulanic acid|GSK;Amoxil 500mg Cap|Amoxicillin|GSK;Septran DS Tab|Co-trimoxazole|GSK;Velosef 500mg Cap|Cephradine|;Ventolin Inhaler|Salbutamol|GSK;Ventolin Syrup|Salbutamol|GSK;Zyrtec 10mg Tab|Cetirizine|GSK;Actifed Syrup|Triprolidine + Pseudoephedrine|GSK;Betnovate Cream|Betamethasone|GSK;Betnovate-N Cream|Betamethasone + Neomycin|GSK;Dermovate Cream|Clobetasol|GSK;Bactroban Ointment|Mupirocin|GSK;Zovirax Cream|Acyclovir|GSK;Brufen 400mg Tab|Ibuprofen|Abbott;Brufen Susp|Ibuprofen|Abbott;Arinac Tab|Ibuprofen + Pseudoephedrine|Abbott;Surbex-Z Tab|Multivitamin + Zinc|Abbott;Klaricid 500mg Tab|Clarithromycin|Abbott;Duphalac Syrup|Lactulose|Abbott;Duphaston Tab|Dydrogesterone|Abbott;Ponstan Forte Tab|Mefenamic acid|Pfizer;Norvasc 5mg Tab|Amlodipine|Pfizer;Lipitor 20mg Tab|Atorvastatin|Pfizer;Zithromax 500mg Tab|Azithromycin|Pfizer;Zithromax Susp|Azithromycin|Pfizer;Lyrica 75mg Cap|Pregabalin|Pfizer;Celebrex 200mg Cap|Celecoxib|Pfizer;Caltrate Tab|Calcium + Vitamin D|Pfizer;Centrum Tab|Multivitamin + Minerals|Pfizer;Flagyl 400mg Tab|Metronidazole|Sanofi;Flagyl Susp|Metronidazole|Sanofi;Amaryl 2mg Tab|Glimepiride|Sanofi;Daonil 5mg Tab|Glibenclamide|Sanofi;Plavix 75mg Tab|Clopidogrel|Sanofi;Lasix 40mg Tab|Furosemide|Sanofi;Avil Tab|Pheniramine|Sanofi;Avil Inj|Pheniramine|Sanofi;Telfast 120mg Tab|Fexofenadine|Sanofi;Telfast 180mg Tab|Fexofenadine|Sanofi;Tavanic 500mg Tab|Levofloxacin|Sanofi;Voltral 50mg Tab|Diclofenac|Novartis;Cataflam 50mg Tab|Diclofenac potassium|Novartis;Voltaren Emulgel|Diclofenac gel|;Diovan 80mg Tab|Valsartan|Novartis;Galvus 50mg Tab|Vildagliptin|Novartis;Tegretol 200mg Tab|Carbamazepine|Novartis;Calcium-Sandoz Tab|Calcium|Novartis;Glucophage 500mg Tab|Metformin|Merck;Glucophage 850mg Tab|Metformin|Merck;Concor 5mg Tab|Bisoprolol|Merck;Euthyrox 50mcg Tab|Levothyroxine|Merck;Neurobion Tab|Vitamin B1 + B6 + B12|Merck;Neurobion Inj|Vitamin B1 + B6 + B12|Merck;Januvia 100mg Tab|Sitagliptin|MSD;Singulair 10mg Tab|Montelukast|MSD;Cozaar 50mg Tab|Losartan|MSD;Arcoxia 90mg Tab|Etoricoxib|MSD;Crestor 10mg Tab|Rosuvastatin|AstraZeneca;Tenormin 50mg Tab|Atenolol|AstraZeneca;Zestril 10mg Tab|Lisinopril|AstraZeneca;Risek 20mg Cap|Omeprazole|Getz;Risek 40mg Cap|Omeprazole|Getz;Risek Insta Sachet|Omeprazole + Sodium bicarbonate|Getz;Getryl 2mg Tab|Glimepiride|Getz;Nexum 20mg Cap|Esomeprazole|Hilton;Nexum 40mg Cap|Esomeprazole|Hilton;Novidat 500mg Tab|Ciprofloxacin|Sami;Ciproxin 500mg Tab|Ciprofloxacin|Bayer;Clarityn 10mg Tab|Loratadine|Bayer;Canesten Cream|Clotrimazole|Bayer;Aspirin 100mg Tab|Aspirin|Bayer;Disprin Tab|Aspirin (soluble)|Reckitt;Gaviscon Liquid|Alginate + Antacid|Reckitt;Strepsils Lozenges|Amylmetacresol + Dichlorobenzyl alcohol|Reckitt;Controloc 40mg Tab|Pantoprazole|Takeda;Motilium 10mg Tab|Domperidone|Janssen;Imodium Cap|Loperamide|Janssen;Daktarin Cream|Miconazole|Janssen;Buscopan Tab|Hyoscine butylbromide|;Benadryl Syrup|Diphenhydramine|;Ascoril Expectorant|Salbutamol + Bromhexine + Guaifenesin|Glenmark;Tobrex Eye Drops|Tobramycin|Alcon;Ciloxan Eye Drops|Ciprofloxacin|Alcon;Maxitrol Eye Drops|Neomycin + Polymyxin B + Dexamethasone|Alcon;Betadine Solution|Povidone iodine|Mundipharma;Fucidin Cream|Fusidic acid|Leo;ORS Sachet|Oral rehydration salts|;Normal Saline 500ml|Sodium chloride|;Dextrose 5% 500ml|Dextrose|;Folic Acid 5mg Tab|Folic acid|;Vitamin C 500mg Tab|Ascorbic acid|;Zinc Syrup|Zinc sulphate|;Cetirizine 10mg Tab|Cetirizine|;Metformin 500mg Tab|Metformin|;Amlodipine 5mg Tab|Amlodipine|;Omeprazole 20mg Cap|Omeprazole|;Paracetamol 500mg Tab|Paracetamol|;Ibuprofen 400mg Tab|Ibuprofen|";
var CATARR=CAT.split(';');
function CA(){return CATARR.concat(D.cx)}
function cs(q,skip){return CA().map(function(r,i){return [r.split('|'),i]}).filter(function(z){return (!skip||!skip[z[0][0].toLowerCase()])&&(z[0][0]+' '+(z[0][1]||'')).toLowerCase().indexOf(q)>-1}).sort(function(a,b){return (b[0][0].toLowerCase().indexOf(q)===0)-(a[0][0].toLowerCase().indexOf(q)===0)}).slice(0,40)}
function norm(){D.cx=D.cx||[];D.agents=D.agents||[];D.set.tiers=D.set.tiers||[]}norm();
function save(){try{localStorage.setItem(K,JSON.stringify(D))}catch(e){alert('Could not save: browser storage is blocked or full.')}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function m(n){return 'Rs '+Number(n||0).toLocaleString(undefined,{maximumFractionDigits:2})}
function today(){return new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10)}
function sum(a,f){return a.reduce(function(x,y){return x+f(y)},0)}
function days(exp){return exp?Math.floor((new Date(exp)-new Date(today()))/864e5):9999}
function f(i,l,t,v){return '<label>'+l+'</label><input id="'+i+'" type="'+(t||'text')+'" value="'+esc(v)+'"'+(t==='number'?' inputmode="decimal" step="any"':'')+'>'}
function num(i){return parseFloat($(i).value)||0}
function val(i){return $(i).value.trim()}
function th(x){return x.img?'<img src="'+x.img+'" style="width:44px;height:44px;object-fit:cover;border-radius:6px">':''}
function find(id){return D.meds.filter(function(x){return x.id===id})[0]}
function alerts(){var a={exp:[],soon:[],low:[]};D.meds.forEach(function(x){var d=days(x.exp);if(d<0)a.exp.push(x);else if(d<=60)a.soon.push(x);if(x.min>0&&x.qty<=x.min)a.low.push(x)});return a}
function bal(k,x){if(k==='custs')return sum(D.sales.filter(function(s){return s.cust===x.id}),function(s){return s.total-s.paid})-(x.rec||0);
return sum(D.purch.filter(function(p){return p.sup===x.name}),function(p){return p.qty*p.cost-p.paid})-(x.rec||0)}
function inc(t){var T=D.set.tiers.slice().sort(function(a,b){return b.min-a.min}),x=T.filter(function(z){return t>=z.min})[0];return x?{x:x,amt:t*x.pct/100+(x.bonus||0)}:{x:null,amt:0}}
function agentTab(a,b){var rows='',gt=0;D.agents.forEach(function(g){var dy={},tot=0,it=0;D.sales.forEach(function(s){if(s.agent===g.id&&s.date>=a&&s.date<=b)dy[s.date]=(dy[s.date]||0)+s.total});
Object.keys(dy).sort().forEach(function(k){var r=inc(dy[k]);tot+=dy[k];it+=r.amt;rows+='<tr><td>'+esc(g.name)+'</td><td>'+k+'</td><td>'+m(dy[k])+'</td><td>'+(r.x?r.x.pct+'%'+(r.x.bonus?' + '+m(r.x.bonus):''):'-')+'</td><td>'+m(r.amt)+'</td></tr>'});
if(tot)rows+='<tr><td colspan="2"><b>'+esc(g.name)+' total</b></td><td><b>'+m(tot)+'</b></td><td></td><td><b>'+m(it)+'</b></td></tr>';gt+=it});
return '<table><tr><th>Agent</th><th>Date</th><th>Sales</th><th>Rate</th><th>Incentive</th></tr>'+(rows||'<tr><td colspan="5">No agent sales in this period.</td></tr>')+'</table><p><b>Total incentive: '+m(gt)+'</b></p>'}
var rf=today().slice(0,8)+'01',rt=today();
var TABS=[['dash','🏠 Home'],['pos','🧾 Sale'],['meds','💊 Stock'],['pur','📦 Buy'],['alr','⚠️ Alerts'],['custs','👥 Customers'],['sups','🏢 Suppliers'],['agents','🧑‍💼 Agents'],['rep','📊 Reports'],['set','⚙️ Settings']];
var V={};
V.dash=function(){var t=today(),ss=D.sales.filter(function(s){return s.date===t}),ps=D.purch.filter(function(p){return p.date===t}),a=alerts();
function c(l,v,cl){return '<div class="c"><small>'+l+'</small><b class="'+(cl||'')+'">'+v+'</b></div>'}
return '<div class="g">'+c("Today's sales",m(sum(ss,function(s){return s.total})))+c("Today's profit",m(sum(ss,function(s){return s.profit})))+c("Today's purchases",m(sum(ps,function(p){return p.qty*p.cost})))+c('Units in stock',sum(D.meds,function(x){return x.qty}))+c('Low stock',a.low.length,a.low.length?'amb':'')+c('Expired',a.exp.length,a.exp.length?'red':'')+'</div>'+(D.meds.length?'':'<p>No medicines yet. Open <b>Stock</b> to add your first one.</p>')};
V.meds=function(){var e=ed||{};
return '<h3>'+(ed?'Edit':'Add')+' medicine</h3>'+'<button class="b" onclick="PH.scanStock()">📷 Scan product barcode</button>'+'<label>Medicine name (type to search the catalog)</label><input id="m_name" autocomplete="off" value="'+esc(e.name)+'" oninput="PH.sm()"><div id="m_sg"></div>'+'<label>Barcode (scan or type)</label><div style="display:flex;gap:6px"><input id="m_bar" value="'+esc(e.bar)+'"><button class="s" onclick="PH.scanTo(\'m_bar\')">📷</button></div><label>Product photo (take or choose)</label><input id="m_img" type="file" accept="image/*" capture="environment" onchange="PH.photo(this)"><div id="m_pv">'+(pimg?'<img src="'+pimg+'" style="height:70px;border-radius:8px">':'')+'</div>'+f('m_gen','Generic name','text',e.gen)+f('m_co','Company','text',e.co)+f('m_batch','Batch number','text',e.batch)+f('m_exp','Expiry date','date',e.exp)+f('m_cost','Purchase price','number',e.cost)+f('m_price','Sale price','number',e.price)+f('m_qty','Quantity','number',e.qty)+f('m_min','Minimum stock','number',e.min)+f('m_sup','Supplier','text',e.sup)+'<button class="b" onclick="PH.saveMed()">Save medicine</button>'+(ed?'<button class="s" onclick="PH.cancel()">Cancel</button>':'')+'<h3>Medicines</h3><input id="phq" placeholder="Search by name or generic" oninput="PH.list()"><div id="ml"></div>'};
V.pos=function(){var ao=D.agents.map(function(a){return '<option value="'+a.id+'"'+(a.id===lastAg?' selected':'')+'>'+esc(a.name)+'</option>'}).join('');var o=D.custs.map(function(c){return '<option value="'+c.id+'">'+esc(c.name)+'</option>'}).join('');
return '<div style="display:flex;gap:6px"><input id="ps" placeholder="🔎 Search or scan barcode" oninput="PH.ps()"><button class="b" style="margin:2px 0 6px" onclick="PH.scanSale()">📷</button></div><div id="pr"></div><h3>Cart</h3><div id="ci"></div><label>Discount (Rs)</label><input id="pd" type="number" inputmode="decimal" oninput="PH.tot()"><label>Sold by (agent)</label><select id="pa"><option value="">No agent</option>'+ao+'</select><label>Customer (optional, needed for credit)</label><select id="pc"><option value="">Walk-in</option>'+o+'</select><label>Cash received (blank = exact)</label><input id="pp" type="number" inputmode="decimal" oninput="PH.tot()"><div class="tot" id="tt"></div><div id="ch"></div><button class="b" onclick="PH.sell()">Complete sale</button><button class="s" onclick="PH.clr()">Clear</button>'};
V.pur=function(){var o=D.meds.map(function(x){return '<option value="'+x.id+'">'+esc(x.name)+' ('+x.qty+')</option>'}).join('');
var dl=D.sups.map(function(s){return '<option value="'+esc(s.name)+'">'}).join('');
var L=D.purch.slice(-20).reverse().map(function(p){return '<div class="r"><div><b>'+esc(p.med)+'</b> × '+p.qty+'<br><small>'+p.date+' · '+esc(p.sup)+' · Inv '+esc(p.inv)+'</small></div><div>'+m(p.qty*p.cost)+'</div></div>'}).join('');
return '<h3>New purchase</h3><label>Supplier</label><input id="u_sup" list="u_dl"><datalist id="u_dl">'+dl+'</datalist>'+f('u_inv','Invoice number')+'<label>Medicine (type brand or generic name)</label><div style="display:flex;gap:6px"><input id="u_f" placeholder="e.g. panadol" autocomplete="off" oninput="PH.sg()"><button class="s" style="margin:2px 0 6px" onclick="PH.scanBuy()">📷</button></div><div id="u_sg"></div><div id="u_sel"></div><input id="u_med" type="hidden">'+f('u_qty','Quantity','number')+f('u_cost','Purchase price (each)','number')+f('u_price','Sale price (each)','number')+f('u_batch','Batch number')+f('u_exp','Expiry date','date')+f('u_paid','Amount paid (blank = full)','number')+'<button class="b" onclick="PH.buy()">Save purchase</button><h3>Recent purchases</h3>'+(L||'<p>No purchases yet.</p>')};
V.alr=function(){var a=alerts();function L(t,arr,cl){return '<h3 class="'+cl+'">'+t+' ('+arr.length+')</h3>'+(arr.map(function(x){return '<div class="r"><div><b>'+esc(x.name)+'</b><br><small>Batch '+esc(x.batch)+' · Exp '+esc(x.exp)+'</small></div><div>Qty '+x.qty+'</div></div>'}).join('')||'<small>None</small>')}
return L('Expired',a.exp,'red')+L('Expiring within 60 days',a.soon,'amb')+L('Low stock',a.low,'amb')};
function party(k){var one=k==='custs'?'customer':'supplier';
var L=D[k].map(function(x){var b=bal(k,x);return '<div class="r"><div><b>'+esc(x.name)+'</b><br><small>'+esc(x.phone)+' · '+(k==='custs'?D.sales.filter(function(s){return s.cust===x.id}).length+' sales':D.purch.filter(function(p){return p.sup===x.name}).length+' purchases')+'</small></div><div class="'+(b>0?'red':'')+'">'+m(b)+(b>0?'<br><button class="s" onclick="PH.settle(\''+k+'\',\''+x.id+'\')">'+(k==='custs'?'Receive':'Pay')+'</button>':'')+'</div></div>'}).join('');
return '<h3>Add '+one+'</h3>'+f('p_name','Name')+f('p_phone','Phone','tel')+'<button class="b" onclick="PH.addParty(\''+k+'\')">Save</button><h3>'+(k==='custs'?'Customers (balance owed to you)':'Suppliers (balance you owe)')+'</h3>'+(L||'<small>None yet.</small>')}
V.agents=function(){var T=D.set.tiers.slice().sort(function(a,b){return a.min-b.min}).map(function(t){return '<div class="r"><div>Daily sales of '+m(t.min)+' or more: <b>'+t.pct+'%</b>'+(t.bonus?' + '+m(t.bonus)+' bonus':'')+'</div><button class="s d" onclick="PH.delTier('+D.set.tiers.indexOf(t)+')">✕</button></div>'}).join('');
var L=D.agents.map(function(g){return '<div class="r"><div><b>'+esc(g.name)+'</b><br><small>'+esc(g.phone)+'</small></div><button class="s d" onclick="PH.delAgent(\''+g.id+'\')">Delete</button></div>'}).join('');
return '<h3>Incentive rules</h3><small>The best matching rule applies to each agent\'s total sales for the day (after discounts).</small>'+(T||'<div><small>No rules yet.</small></div>')+f('t_min','Daily sales target (Rs)','number')+f('t_pct','Incentive % of that day\'s sales','number')+f('t_bonus','Fixed bonus (Rs, optional)','number')+'<button class="b" onclick="PH.addTier()">Add rule</button><h3>Add agent</h3>'+f('p_name','Name')+f('p_phone','Phone','tel')+'<button class="b" onclick="PH.addAgent()">Save agent</button><h3>Agents</h3>'+(L||'<small>No agents yet.</small>')+'<h3>Today\'s incentives</h3>'+agentTab(today(),today())+'<small>Choose the agent on the Sale screen. See other dates under Reports.</small>'};

V.rep=function(){var ss=D.sales.filter(function(s){return s.date>=rf&&s.date<=rt}),ps=D.purch.filter(function(p){return p.date>=rf&&p.date<=rt}),dy={};

function render(){var A=$('ph-app');
